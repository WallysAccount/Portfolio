<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Currency converter interface illustration</title>
  <desc id="desc">A dark software window with USD and EUR amount fields, a conversion arrow, and a highlighted exchange rate.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#182538"/><stop offset="1" stop-color="#0d1522"/></linearGradient><linearGradient id="accent" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient></defs>
  <rect width="760" height="420" rx="18" fill="url(#bg)"/>
  <circle cx="32" cy="30" r="6" fill="#fb7185"/><circle cx="53" cy="30" r="6" fill="#fbbf24"/><circle cx="74" cy="30" r="6" fill="#34d399"/>
  <rect x="26" y="62" width="708" height="1" fill="#334155"/>
  <text x="56" y="111" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">CURRENCY CONVERTER</text>
  <text x="56" y="150" fill="#f3f4f6" font-family="Arial,sans-serif" font-size="27" font-weight="700">Convert currencies</text>
  <rect x="56" y="178" width="294" height="82" rx="12" fill="#1f2937" stroke="#3b4b60"/>
  <text x="78" y="207" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">FROM</text><text x="78" y="240" fill="#f3f4f6" font-family="Arial,sans-serif" font-size="24" font-weight="700">100.00</text>
  <rect x="258" y="196" width="70" height="45" rx="8" fill="#29384b"/><text x="276" y="224" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="15" font-weight="700">USD</text>
  <circle cx="380" cy="219" r="22" fill="#10283a" stroke="#38bdf8" stroke-opacity=".5"/><path d="M370 219h20m-6-7 7 7-7 7" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="410" y="178" width="294" height="82" rx="12" fill="#1f2937" stroke="#3b4b60"/>
  <text x="432" y="207" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">TO</text><text x="432" y="240" fill="#f3f4f6" font-family="Arial,sans-serif" font-size="24" font-weight="700">92.14</text>
  <rect x="612" y="196" width="70" height="45" rx="8" fill="#29384b"/><text x="630" y="224" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="15" font-weight="700">EUR</text>
  <rect x="56" y="282" width="648" height="66" rx="11" fill="#10283a" stroke="#38bdf8" stroke-opacity=".24"/>
  <circle cx="84" cy="315" r="10" fill="url(#accent)"/><path d="m79 315 4 4 7-8" fill="none" stroke="#07111d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="106" y="311" fill="#94a3b8" font-family="Arial,sans-serif" font-size="12">EXCHANGE RATE</text><text x="106" y="332" fill="#dbeafe" font-family="Arial,sans-serif" font-size="15" font-weight="700">1 USD = 0.9214 EUR</text>
</svg>
